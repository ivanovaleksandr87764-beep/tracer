<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Трекер задач</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--tg-theme-bg-color, #1c1c1e);
      color: var(--tg-theme-text-color, #ffffff);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* ── Header ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--tg-theme-bg-color, #1c1c1e);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 12px 16px 8px;
    }

    .header-title { font-size: 17px; font-weight: 600; }
    .header-sub { font-size: 12px; color: var(--tg-theme-hint-color, #8e8e93); margin-top: 2px; }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 12px 16px;
    }

    .stat-card {
      background: var(--tg-theme-secondary-bg-color, #2c2c2e);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
    }

    .stat-num { font-size: 22px; font-weight: 700; }
    .stat-label { font-size: 10px; color: var(--tg-theme-hint-color, #8e8e93); margin-top: 2px; line-height: 1.2; }
    .stat-num.blue { color: #3b82f6; }
    .stat-num.yellow { color: #f59e0b; }
    .stat-num.green { color: #22c55e; }
    .stat-num.red { color: #ef4444; }

    /* ── Filters ── */
    .filters {
      padding: 0 16px 8px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }

    .chip {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      background: var(--tg-theme-secondary-bg-color, #2c2c2e);
      color: var(--tg-theme-hint-color, #8e8e93);
      border: none;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip.active {
      background: var(--tg-theme-button-color, #3b82f6);
      color: var(--tg-theme-button-text-color, #fff);
    }

    /* ── Search ── */
    .search-wrap { padding: 0 16px 10px; }
    .search {
      width: 100%;
      background: var(--tg-theme-secondary-bg-color, #2c2c2e);
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      color: var(--tg-theme-text-color, #fff);
      font-size: 15px;
      outline: none;
    }
    .search::placeholder { color: var(--tg-theme-hint-color, #8e8e93); }

    /* ── Tasks ── */
    .tasks { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }

    .task {
      background: var(--tg-theme-secondary-bg-color, #2c2c2e);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      active: opacity(0.7);
    }

    .task.done { opacity: 0.45; }

    .task-dot {
      width: 11px; height: 11px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px;
      cursor: pointer;
    }
    .dot-todo { background: #3b82f6; }
    .dot-in_progress { background: #f59e0b; }
    .dot-done { background: #22c55e; }

    .task-body { flex: 1; min-width: 0; }

    .task-title {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 5px;
    }
    .task.done .task-title {
      text-decoration: line-through;
      color: var(--tg-theme-hint-color, #8e8e93);
    }

    .task-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tag {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 20px;
      font-weight: 500;
    }
    .tag-todo { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .tag-in_progress { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .tag-done { background: rgba(34,197,94,0.15); color: #4ade80; }
    .tag-high { background: rgba(239,68,68,0.15); color: #f87171; }
    .tag-medium { background: rgba(245,158,11,0.12); color: #fbbf24; }
    .tag-low { background: rgba(107,114,128,0.15); color: #9ca3af; }
    .tag-cat { background: rgba(139,92,246,0.15); color: #a78bfa; }
    .tag-deadline { background: rgba(239,68,68,0.12); color: #fca5a5; }

    .task-context {
      font-size: 12px;
      color: var(--tg-theme-hint-color, #8e8e93);
      margin-top: 5px;
      line-height: 1.4;
    }

    /* ── FAB ── */
    .fab {
      position: fixed;
      bottom: 20px;
      right: 16px;
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--tg-theme-button-color, #3b82f6);
      color: var(--tg-theme-button-text-color, #fff);
      border: none;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
    }

    /* ── Bottom sheet modal ── */
    .sheet-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 60;
      align-items: flex-end;
    }
    .sheet-overlay.open { display: flex; }

    .sheet {
      background: var(--tg-theme-bg-color, #1c1c1e);
      border-radius: 20px 20px 0 0;
      padding: 8px 16px 32px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .sheet-handle {
      width: 36px; height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 2px;
      margin: 8px auto 16px;
    }

    .sheet h3 { font-size: 17px; font-weight: 600; margin-bottom: 16px; }

    .field { margin-bottom: 12px; }
    .field label {
      font-size: 12px;
      color: var(--tg-theme-hint-color, #8e8e93);
      margin-bottom: 5px;
      display: block;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .field input, .field select, .field textarea {
      width: 100%;
      background: var(--tg-theme-secondary-bg-color, #2c2c2e);
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--tg-theme-text-color, #fff);
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }
    .field select option { background: #2c2c2e; }
    .field textarea { resize: none; min-height: 70px; }

    .sheet-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--tg-theme-button-color, #3b82f6);
      color: var(--tg-theme-button-text-color, #fff);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--tg-theme-hint-color, #8e8e93);
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty h3 { font-size: 17px; font-weight: 600; margin-bottom: 6px; color: var(--tg-theme-text-color,#fff); }

    /* ── Analyze sheet ── */
    .analyze-area {
      width: 100%;
      background: var(--tg-theme-secondary-bg-color, #2c2c2e);
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--tg-theme-text-color, #fff);
      font-size: 15px;
      outline: none;
      font-family: inherit;
      resize: none;
      min-height: 100px;
      margin-bottom: 10px;
    }
    .analyze-area::placeholder { color: var(--tg-theme-hint-color,#8e8e93); }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Tab bar ── */
    .tabbar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--tg-theme-secondary-bg-color, #2c2c2e);
      display: flex;
      border-top: 1px solid rgba(255,255,255,0.06);
      z-index: 40;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0 6px;
      font-size: 10px;
      color: var(--tg-theme-hint-color, #8e8e93);
      cursor: pointer;
      border: none;
      background: none;
      gap: 3px;
    }
    .tab.active { color: var(--tg-theme-button-color, #3b82f6); }
    .tab-icon { font-size: 22px; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-title">Трекер задач</div>
  <div class="header-sub" id="header-sub">Загрузка...</div>
</div>

<!-- Stats -->
<div class="stats">
  <div class="stat-card"><div class="stat-num" id="s-total">—</div><div class="stat-label">Всего</div></div>
  <div class="stat-card"><div class="stat-num blue" id="s-todo">—</div><div class="stat-label">К работе</div></div>
  <div class="stat-card"><div class="stat-num yellow" id="s-inprogress">—</div><div class="stat-label">В работе</div></div>
  <div class="stat-card"><div class="stat-num green" id="s-done">—</div><div class="stat-label">Готово</div></div>
</div>

<!-- Status filters -->
<div class="filters" id="status-filters">
  <button class="chip active" onclick="setStatus('',this)">Все</button>
  <button class="chip" onclick="setStatus('todo',this)">🔵 К работе</button>
  <button class="chip" onclick="setStatus('in_progress',this)">🟡 В работе</button>
  <button class="chip" onclick="setStatus('done',this)">🟢 Готово</button>
</div>

<!-- Category filters -->
<div class="filters" id="cat-filters">
  <button class="chip active" onclick="setCat('',this)">Все</button>
  <button class="chip" onclick="setCat('обучение',this)">📚 Обучение</button>
  <button class="chip" onclick="setCat('продукт',this)">🛠 Продукт</button>
  <button class="chip" onclick="setCat('контент',this)">✍️ Контент</button>
  <button class="chip" onclick="setCat('маркетинг',this)">📣 Маркетинг</button>
  <button class="chip" onclick="setCat('продажи',this)">💰 Продажи</button>
  <button class="chip" onclick="setCat('операционка',this)">⚙️ Операционка</button>
</div>

<!-- Search -->
<div class="search-wrap">
  <input class="search" type="text" id="search" placeholder="🔍 Поиск..." oninput="loadTasks()"/>
</div>

<!-- Tasks list -->
<div class="tasks" id="tasks"></div>

<!-- Tab bar -->
<div class="tabbar">
  <button class="tab active" onclick="showView('tasks')">
    <span class="tab-icon">📋</span>Задачи
  </button>
  <button class="tab" onclick="showView('analyze')">
    <span class="tab-icon">🤖</span>Анализ
  </button>
  <button class="tab" onclick="showView('add')">
    <span class="tab-icon">➕</span>Добавить
  </button>
</div>

<!-- Sheet: Добавить задачу -->
<div class="sheet-overlay" id="sheet-add">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3>Новая задача</h3>
    <div class="field"><label>Название</label><input type="text" id="f-title" placeholder="Что нужно сделать?"/></div>
    <div class="field"><label>Исполнитель</label><input type="text" id="f-assignee" placeholder="Имя"/></div>
    <div class="field"><label>Дедлайн</label><input type="text" id="f-deadline" placeholder="до конца недели / 10 июня..."/></div>
    <div class="field">
      <label>Приоритет</label>
      <select id="f-priority">
        <option value="high">🔴 Высокий</option>
        <option value="medium" selected>🟡 Средний</option>
        <option value="low">⚪ Низкий</option>
      </select>
    </div>
    <div class="field">
      <label>Категория</label>
      <select id="f-category">
        <option value="обучение">📚 Обучение</option>
        <option value="маркетинг">📣 Маркетинг</option>
        <option value="продажи">💰 Продажи</option>
        <option value="контент">✍️ Контент</option>
        <option value="операционка" selected>⚙️ Операционка</option>
        <option value="продукт">🛠 Продукт</option>
      </select>
    </div>
    <div class="field"><label>Контекст</label><textarea id="f-context" placeholder="Зачем эта задача?"></textarea></div>
    <button class="sheet-btn" onclick="saveTask()">Сохранить</button>
  </div>
</div>

<!-- Sheet: Анализ сообщения -->
<div class="sheet-overlay" id="sheet-analyze">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3>🤖 Анализ сообщения</h3>
    <textarea class="analyze-area" id="analyze-text" placeholder="Вставь сообщение из чата — бот найдёт задачи автоматически..."></textarea>
    <input type="text" id="analyze-author" placeholder="Автор (необязательно)"
      style="width:100%;background:var(--tg-theme-secondary-bg-color,#2c2c2e);border:none;border-radius:10px;padding:10px 12px;color:var(--tg-theme-text-color,#fff);font-size:15px;outline:none;margin-bottom:10px;"/>
    <button class="sheet-btn" id="analyze-btn" onclick="analyzeMsg()">Найти задачи</button>
  </div>
</div>

<script>
  // ── Telegram WebApp init ──────────────────────────────────────────────
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor('bg_color');
  }

  // ── State ─────────────────────────────────────────────────────────────
  let filterStatus = '';
  let filterCat = '';

  const STATUS_LABELS = { todo: 'К работе', in_progress: 'В работе', done: 'Готово' };
  const PRIORITY_LABELS = { high: 'Высокий', medium: 'Средний', low: 'Низкий' };
  const STATUS_NEXT = { todo: 'in_progress', in_progress: 'done', done: 'todo' };

  // ── API ───────────────────────────────────────────────────────────────
  async function api(path, opts={}) {
    const r = await fetch(path, { headers: {'Content-Type':'application/json'}, ...opts });
    return r.json();
  }

  // ── Stats ─────────────────────────────────────────────────────────────
  async function loadStats() {
    const s = await api('/api/stats');
    document.getElementById('s-total').textContent = s.total;
    document.getElementById('s-todo').textContent = s.todo;
    document.getElementById('s-inprogress').textContent = s.in_progress;
    document.getElementById('s-done').textContent = s.done;
    document.getElementById('header-sub').textContent =
      `${s.total} задач · ${s.high || 0} срочных`;
  }

  // ── Tasks ─────────────────────────────────────────────────────────────
  async function loadTasks() {
    const p = new URLSearchParams();
    if (filterStatus) p.set('status', filterStatus);
    if (filterCat) p.set('category', filterCat);
    const q = document.getElementById('search').value;
    if (q) p.set('search', q);

    const tasks = await api('/api/tasks?' + p);
    renderTasks(tasks);
  }

  function renderTasks(tasks) {
    const el = document.getElementById('tasks');
    if (!tasks.length) {
      el.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><h3>Задач нет</h3><p>Измени фильтр или добавь новую</p></div>`;
      return;
    }
    el.innerHTML = tasks.map(t => `
      <div class="task ${t.status==='done'?'done':''}" id="card-${t.id}">
        <div class="task-dot dot-${t.status}" onclick="cycleStatus(${t.id},'${t.status}')"></div>
        <div class="task-body" onclick="openTask(${t.id})">
          <div class="task-title">${esc(t.title)}</div>
          <div class="task-tags">
            <span class="tag tag-${t.status}">${STATUS_LABELS[t.status]||t.status}</span>
            <span class="tag tag-${t.priority}">${PRIORITY_LABELS[t.priority]||t.priority}</span>
            ${t.category?`<span class="tag tag-cat">${esc(t.category)}</span>`:''}
            ${t.deadline?`<span class="tag tag-deadline">📅 ${esc(t.deadline)}</span>`:''}
            ${t.assignee?`<span class="tag tag-cat">👤 ${esc(t.assignee)}</span>`:''}
          </div>
          ${t.context?`<div class="task-context">${esc(t.context)}</div>`:''}
        </div>
      </div>
    `).join('');
  }

  async function cycleStatus(id, current) {
    const next = STATUS_NEXT[current] || 'todo';
    await api(`/api/tasks/${id}`, { method:'PATCH', body: JSON.stringify({status: next}) });
    if (tg) tg.HapticFeedback?.impactOccurred('light');
    loadTasks(); loadStats();
  }

  function openTask(id) {
    // В будущем — детальный экран задачи
  }

  // ── Filters ───────────────────────────────────────────────────────────
  function setStatus(val, el) {
    filterStatus = val;
    document.querySelectorAll('#status-filters .chip').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    loadTasks();
  }

  function setCat(val, el) {
    filterCat = val;
    document.querySelectorAll('#cat-filters .chip').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    loadTasks();
  }

  // ── Views / sheets ────────────────────────────────────────────────────
  function showView(view) {
    document.querySelectorAll('.tab').forEach((t,i) => {
      t.classList.toggle('active', ['tasks','analyze','add'][i] === view);
    });
    if (view === 'add') openSheet('sheet-add');
    else if (view === 'analyze') openSheet('sheet-analyze');
  }

  function openSheet(id) {
    document.getElementById(id).classList.add('open');
    document.getElementById(id).onclick = e => {
      if (e.target === document.getElementById(id)) closeSheets();
    };
  }

  function closeSheets() {
    document.querySelectorAll('.sheet-overlay').forEach(s => s.classList.remove('open'));
    document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===0));
  }

  // ── Save task ─────────────────────────────────────────────────────────
  async function saveTask() {
    const title = document.getElementById('f-title').value.trim();
    if (!title) { tg?.HapticFeedback?.notificationOccurred('error'); return; }

    const data = {
      title,
      assignee: document.getElementById('f-assignee').value,
      deadline: document.getElementById('f-deadline').value || null,
      priority: document.getElementById('f-priority').value,
      category: document.getElementById('f-category').value,
      context: document.getElementById('f-context').value,
      status: 'todo',
    };

    await api('/api/tasks', { method:'POST', body: JSON.stringify(data) });
    tg?.HapticFeedback?.notificationOccurred('success');
    closeSheets();
    loadTasks(); loadStats();

    // Очищаем форму
    ['f-title','f-assignee','f-deadline','f-context'].forEach(id => document.getElementById(id).value='');
  }

  // ── Analyze message ───────────────────────────────────────────────────
  async function analyzeMsg() {
    const text = document.getElementById('analyze-text').value.trim();
    if (!text) return;

    const btn = document.getElementById('analyze-btn');
    btn.innerHTML = '<span class="spinner"></span>Анализирую...';
    btn.disabled = true;

    try {
      const tasks = await api('/api/analyze', {
        method: 'POST',
        body: JSON.stringify({
          text,
          author: document.getElementById('analyze-author').value || '',
        }),
      });
      tg?.HapticFeedback?.notificationOccurred('success');
      if (tg) {
        tg.showPopup({ title: '✅ Готово', message: `Найдено задач: ${tasks.length}`, buttons: [{type:'ok'}] });
      }
      document.getElementById('analyze-text').value = '';
      closeSheets();
      loadTasks(); loadStats();
    } catch(e) {
      tg?.HapticFeedback?.notificationOccurred('error');
    }

    btn.innerHTML = 'Найти задачи';
    btn.disabled = false;
  }

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Init ──────────────────────────────────────────────────────────────
  loadStats();
  loadTasks();
</script>
</body>
</html>
